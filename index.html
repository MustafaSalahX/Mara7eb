<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>كافيه مراحب | منيو</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Floating Controls (Discreet & Non-obtrusive) -->
  <aside class="floating-controls" aria-label="أدوات التحكم بالصورة">
    <button id="zoomInBtn" class="control-btn" title="تكبير (+)" aria-label="تكبير">
      <i class="fa-solid fa-plus"></i>
    </button>
    <button id="zoomOutBtn" class="control-btn" title="تصغير (-)" aria-label="تصغير">
      <i class="fa-solid fa-minus"></i>
    </button>
    <button id="zoomResetBtn" class="control-btn" title="إعادة الضبط" aria-label="إعادة ضبط الحجم">
      <i class="fa-solid fa-arrows-rotate"></i>
    </button>
    <button id="fullscreenBtn" class="control-btn" title="ملء الشاشة" aria-label="ملء الشاشة">
      <i class="fa-solid fa-expand"></i>
    </button>
    <a href="menu.jpg" download="منيو-كافيه-مراحب.jpg" class="control-btn" title="تحميل الصورة" aria-label="تحميل صورة المنيو">
      <i class="fa-solid fa-download"></i>
    </a>
  </aside>

  <!-- Main Image Viewer Container (Takes 100% Viewport) -->
  <main class="viewer-container" id="viewerContainer">
    <div class="pan-zoom-layer" id="panZoomLayer">
      <img 
        id="menuImage" 
        src="menu.jpg" 
        alt="منيو كافيه مراحب" 
        loading="eager"
        draggable="false"
        onerror="this.onerror=null; this.src='WhatsApp Image 2026-10-07 at 10.57.17 PM.jpeg';"
      >
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
